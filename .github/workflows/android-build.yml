name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Sync web assets to Android
      run: |
        mkdir -p android/app/src/main/assets/public
        cp index.html android/app/src/main/assets/public/index.html
        cp manifest.json android/app/src/main/assets/public/manifest.json
        cp sw.js android/app/src/main/assets/public/sw.js
        cp app-logo.png android/app/src/main/assets/public/app-logo.png
        if [ -d "assets" ]; then
          cp -r assets android/app/src/main/assets/public/
        fi
        cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

    - name: Grant execute permission for gradlew
      working-directory: android
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Debug APK
      working-directory: android
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: The-Escape-Journey-debug-apk
        path: |
          android/app/build/outputs/apk/debug/*.apk
          apk/The-Escape-Journey.apk
        if-no-files-found: warn
        retention-days: 30
