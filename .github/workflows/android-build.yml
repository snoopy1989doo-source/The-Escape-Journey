name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies & Build www
      run: |
        npm ci
        npm run build

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true

    - name: Sync Capacitor Android
      run: |
        npx cap copy android

    - name: Grant execute permission for gradlew
      working-directory: android
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Debug APK
      working-directory: android
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../gradle.log

    - name: Output Summary on Failure
      if: failure()
      run: |
        echo "## ❌ Gradle Build Failure Details" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
        tail -n 60 gradle.log >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-log
        path: gradle.log
        if-no-files-found: ignore
        retention-days: 7

    - name: Prepare Named APK
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk The-Escape-Journey.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: The-Escape-Journey-debug-apk
        path: The-Escape-Journey.apk
        retention-days: 30

    - name: Create or Update GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "The Escape Journey v1.0.0 (Android APK)"
        body: |
          ### 📱 The Escape Journey: จากมนุษย์เงินเดือนสู้ชีวิต ➔ สู่ Full-Time Investor

          กดดาวน์โหลดไฟล์ `.apk` ด้านล่างนี้เพื่อติดตั้งลงโทรศัพท์มือถือ Android ได้ทันที!
        files: The-Escape-Journey.apk
